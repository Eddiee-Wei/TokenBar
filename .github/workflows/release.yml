name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tokenbar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Validate version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$VERSION"
          fi

      - name: Test
        run: swift test

      - name: Build universal DMG
        run: RELEASE_BUILD=0 BUILD_NUMBER="$GITHUB_RUN_NUMBER" Scripts/package-dmg.sh

      - name: Verify artifacts
        run: |
          lipo dist/TokenBar.app/Contents/MacOS/TokenBar -verify_arch x86_64 arm64
          codesign --verify --deep --strict --verbose=2 dist/TokenBar.app
          hdiutil verify dist/TokenBar.dmg
          (cd dist && shasum -a 256 -c SHA256SUMS)

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: TokenBar-${{ github.ref_name }}
          path: |
            dist/TokenBar.dmg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/TokenBar.dmg dist/SHA256SUMS --clobber
            gh release edit "$TAG" \
              --title "TokenBar $VERSION" \
              --notes-file Distribution/RELEASE_NOTES.md
          else
            gh release create "$TAG" \
              dist/TokenBar.dmg \
              dist/SHA256SUMS \
              --target "$GITHUB_SHA" \
              --title "TokenBar $VERSION" \
              --notes-file Distribution/RELEASE_NOTES.md
          fi
